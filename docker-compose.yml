version: "3.8"

services:
  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=https://itx-frontend-test.onrender.com
    stdin_open: true
    tty: true

  # Optional: nginx for production build
  nginx:
    image: nginx:alpine
    container_name: frontend-nginx
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    profiles:
      - production
